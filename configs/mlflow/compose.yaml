services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.1
    container_name: mlflow-tracking-server
    restart: unless-stopped

    ports:
      - "127.0.0.1:5000:5000"

    volumes:
      - ../../data/mlflow-server:/mlflow

    command:
      - mlflow
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --workers
      - "1"
